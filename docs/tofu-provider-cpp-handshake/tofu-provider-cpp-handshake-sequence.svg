<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">OpenTofu and C++ provider startup and handshake</title>
<desc id="desc">OpenTofu launches the provider executable with environment variables. The provider opens a gRPC server on a loopback port, then prints one handshake line on stdout. OpenTofu connects to that port, optionally with mutual TLS, and then sends provider RPCs such as GetSchema, PlanResourceChange and ApplyResourceChange.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#3556a8"/>
</marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#1f7a4d"/>
</marker>
</defs>
<rect width="900" height="640" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033" text-anchor="middle">

<!-- lifelines -->
<g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6">
<line x1="150" y1="76" x2="150" y2="620"/>
<line x1="750" y1="76" x2="750" y2="620"/>
</g>

<!-- participants -->
<g fill="#e8efff" stroke="#3556a8" stroke-width="2">
<rect x="50" y="24" width="200" height="52" rx="6"/>
<rect x="650" y="24" width="200" height="52" rx="6"/>
</g>
<text x="150" y="46" font-weight="bold" font-size="16">OpenTofu core</text>
<text x="150" y="65" font-size="13" fill="#475569">tofu 1.13.1</text>
<text x="750" y="46" font-weight="bold" font-size="16">C++ provider</text>
<text x="750" y="65" font-size="13" fill="#475569">terraform-provider-workaround</text>

<!-- 1: launch -->
<circle cx="40" cy="123" r="13" fill="#3556a8"/>
<text x="40" y="128" fill="#ffffff" font-weight="bold">1</text>
<text x="450" y="118">Start executable + environment variables</text>
<text x="450" y="136" font-size="12" fill="#475569">TF_PLUGIN_MAGIC_COOKIE, PLUGIN_PROTOCOL_VERSIONS, PLUGIN_CLIENT_CERT</text>
<path d="M150 146 H742" stroke="#3556a8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

<!-- 2: provider prepares -->
<circle cx="40" cy="203" r="13" fill="#b58b29"/>
<text x="40" y="208" fill="#ffffff" font-weight="bold">2</text>
<rect x="520" y="172" width="360" height="80" rx="5" fill="#fff5d6" stroke="#b58b29" stroke-width="1.5"/>
<text x="700" y="196" font-weight="bold">Provider gets ready</text>
<text x="700" y="216" font-size="13">bind 127.0.0.1:0 (any free port)</text>
<text x="700" y="234" font-size="13">register tfplugin5.Provider, start gRPC server</text>

<!-- 3: handshake -->
<circle cx="40" cy="303" r="13" fill="#1f7a4d"/>
<text x="40" y="308" fill="#ffffff" font-weight="bold">3</text>
<text x="450" y="288">ONE line on stdout, then flush</text>
<rect x="215" y="296" width="470" height="26" rx="4" fill="#e6f4ec" stroke="#1f7a4d" stroke-width="1"/>
<text x="450" y="314" font-family="Menlo, Consolas, monospace" font-size="13">1|5|tcp|127.0.0.1:PORT|grpc|&lt;cert or empty&gt;</text>
<path d="M742 340 H158" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowg)"/>
<text x="450" y="358" font-size="12" fill="#475569">Core connects the moment it reads this line, so the server must already be listening</text>

<!-- 4: connect -->
<circle cx="40" cy="413" r="13" fill="#3556a8"/>
<text x="40" y="418" fill="#ffffff" font-weight="bold">4</text>
<text x="450" y="398">Connect to PORT</text>
<text x="450" y="416" font-size="12" fill="#475569">mutual TLS by default (TODO) · plaintext with TF_DISABLE_PLUGIN_TLS=1</text>
<path d="M150 428 H742" stroke="#3556a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

<!-- 5: RPCs -->
<circle cx="40" cy="493" r="13" fill="#3556a8"/>
<text x="40" y="498" fill="#ffffff" font-weight="bold">5</text>
<text x="450" y="478">gRPC calls</text>
<path d="M150 488 H742" stroke="#3556a8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M742 512 H158" stroke="#3556a8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="534" font-size="13">GetSchema · PlanResourceChange · ApplyResourceChange · Stop</text>

<!-- 6: shutdown -->
<rect x="520" y="560" width="360" height="52" rx="5" fill="#e6f4ec" stroke="#1f7a4d" stroke-width="1.5"/>
<text x="700" y="582" font-weight="bold">Shutdown RPC answered</text>
<text x="700" y="600" font-size="13">Provider exits by itself, nothing is killed</text>
</g>
</svg>
