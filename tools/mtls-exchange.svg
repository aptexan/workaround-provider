<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">Automatic mutual TLS between OpenTofu and the provider</title>
<desc id="desc">Two columns, OpenTofu Core and the provider. Core makes its own certificate and passes it to the provider in an environment variable. The provider makes its own certificate, prints it in the handshake line, and accepts only clients that present Core's certificate. Core trusts only the certificate from the handshake line and checks the name localhost. Then all calls run over the encrypted connection.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3556a8"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f7a4d"/></marker>
</defs>
<rect width="900" height="640" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e293b">
<text x="450" y="28" font-size="17" font-weight="bold" text-anchor="middle">Automatic mutual TLS: who gets which certificate</text>

<rect x="40" y="48" width="260" height="38" rx="6" fill="#e8eefb" stroke="#3556a8"/>
<text x="170" y="72" font-size="14" font-weight="bold" text-anchor="middle">OpenTofu Core (Go)</text>
<rect x="600" y="48" width="260" height="38" rx="6" fill="#e8eefb" stroke="#3556a8"/>
<text x="730" y="72" font-size="14" font-weight="bold" text-anchor="middle">Provider (our C++ program)</text>
<line x1="170" y1="86" x2="170" y2="620" stroke="#94a3b8" stroke-dasharray="4 4"/>
<line x1="730" y1="86" x2="730" y2="620" stroke="#94a3b8" stroke-dasharray="4 4"/>

<!-- 1 -->
<rect x="50" y="104" width="240" height="56" rx="6" fill="#fdf6e3" stroke="#b58b29"/>
<text x="170" y="126" font-size="12" text-anchor="middle">1. makes its own certificate + key</text>
<text x="170" y="144" font-size="12" text-anchor="middle">(ECDSA P-521, name "localhost")</text>

<!-- 2 -->
<line x1="170" y1="190" x2="730" y2="190" stroke="#3556a8" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="180" font-size="12" text-anchor="middle">2. starts the program; environment PLUGIN_CLIENT_CERT = Core's certificate (public part, PEM)</text>
<text x="450" y="208" font-size="11" fill="#475569" text-anchor="middle">the private key stays inside Core</text>

<!-- 3 -->
<rect x="610" y="228" width="240" height="72" rx="6" fill="#fdf6e3" stroke="#b58b29"/>
<text x="730" y="250" font-size="12" text-anchor="middle">3. makes ITS OWN certificate + key</text>
<text x="730" y="268" font-size="12" text-anchor="middle">(same profile; key never leaves memory)</text>
<text x="730" y="286" font-size="12" text-anchor="middle">gRPC TLS server: client must show Core's cert</text>

<!-- 4 -->
<line x1="730" y1="340" x2="170" y2="340" stroke="#1f7a4d" stroke-width="2" marker-end="url(#g)"/>
<text x="450" y="328" font-size="12" text-anchor="middle">4. the one line on stdout:  1|6|tcp|127.0.0.1:PORT|grpc|&lt;provider cert, base64 DER, no '='&gt;</text>
<text x="450" y="358" font-size="11" fill="#475569" text-anchor="middle">only after the server is listening</text>

<!-- 5 -->
<rect x="50" y="378" width="240" height="56" rx="6" fill="#fdf6e3" stroke="#b58b29"/>
<text x="170" y="400" font-size="12" text-anchor="middle">5. trusts ONLY the certificate</text>
<text x="170" y="418" font-size="12" text-anchor="middle">from that line; expects name "localhost"</text>

<!-- 6 -->
<line x1="170" y1="470" x2="730" y2="470" stroke="#3556a8" stroke-width="2" marker-end="url(#a)"/>
<line x1="730" y1="486" x2="170" y2="486" stroke="#3556a8" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="460" font-size="12" text-anchor="middle">6. TLS handshake (TLS 1.2 or newer), both sides show a certificate</text>
<text x="450" y="506" font-size="11" fill="#475569" text-anchor="middle">Core checks the provider's certificate against the handshake line; the provider checks Core's against PLUGIN_CLIENT_CERT</text>

<!-- 7 -->
<line x1="170" y1="548" x2="730" y2="548" stroke="#1f7a4d" stroke-width="2" marker-end="url(#g)"/>
<line x1="730" y1="564" x2="170" y2="564" stroke="#1f7a4d" stroke-width="2" marker-end="url(#g)"/>
<text x="450" y="538" font-size="12" text-anchor="middle">7. gRPC over the encrypted connection: GetSchema, Plan, Apply, health, streams, Shutdown</text>

<rect x="40" y="586" width="820" height="38" rx="6" fill="#fdecea" stroke="#b42318"/>
<text x="450" y="609" font-size="12" text-anchor="middle">Anyone else (no certificate, or a different one) is refused at step 6, and plain text to this port is refused too.</text>
</g>
</svg>
